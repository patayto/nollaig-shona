<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1.1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .pin-display {
            width: 100%;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 2em;
            text-align: center;
            letter-spacing: 0.5em;
            font-family: monospace;
            background: #f8f9fa;
            margin-bottom: 20px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pin-dots {
            display: flex;
            gap: 15px;
        }

        .pin-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e0e0e0;
        }

        .pin-dot.filled {
            background: #667eea;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .numpad-btn {
            padding: 20px;
            font-size: 1.5em;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .numpad-btn:hover {
            background: #f8f9fa;
            border-color: #667eea;
        }

        .numpad-btn:active {
            transform: scale(0.95);
            background: #667eea;
            color: white;
        }

        .numpad-btn.delete {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .numpad-btn.delete:hover {
            background: #c82333;
        }

        .numpad-btn.zero {
            grid-column: 2;
        }

        .btn-submit {
            background: #28a745;
            color: white;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #218838;
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error-message {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .recipient-screen {
            text-align: center;
        }

        .recipient-name {
            font-size: 3em;
            font-weight: bold;
            color: #28a745;
            margin: 30px 0;
            padding: 30px;
            background: #d4edda;
            border-radius: 15px;
            border: 3px solid #28a745;
        }

        .message {
            font-size: 1.2em;
            color: #666;
            margin: 20px 0;
        }

        .btn-logout {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin-top: 20px;
        }

        .btn-logout:hover {
            background: #5568d3;
        }

        .welcome-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <h1>🎅 Nollaig Shona</h1>
            <p class="subtitle">Secret Santa Login</p>

            <div class="error-message" id="errorMessage"></div>

            <div class="input-group">
                <label for="nameInput">Your Name</label>
                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name..."
                    autocomplete="off"
                    autofocus
                >
            </div>

            <div class="input-group">
                <label>Your 4-Digit PIN</label>
                <div class="pin-display">
                    <div class="pin-dots">
                        <div class="pin-dot" id="dot1"></div>
                        <div class="pin-dot" id="dot2"></div>
                        <div class="pin-dot" id="dot3"></div>
                        <div class="pin-dot" id="dot4"></div>
                    </div>
                </div>
            </div>

            <div class="numpad">
                <button class="numpad-btn" onclick="addDigit('1')">1</button>
                <button class="numpad-btn" onclick="addDigit('2')">2</button>
                <button class="numpad-btn" onclick="addDigit('3')">3</button>
                <button class="numpad-btn" onclick="addDigit('4')">4</button>
                <button class="numpad-btn" onclick="addDigit('5')">5</button>
                <button class="numpad-btn" onclick="addDigit('6')">6</button>
                <button class="numpad-btn" onclick="addDigit('7')">7</button>
                <button class="numpad-btn" onclick="addDigit('8')">8</button>
                <button class="numpad-btn" onclick="addDigit('9')">9</button>
                <button class="numpad-btn delete" onclick="deleteDigit()">←</button>
                <button class="numpad-btn zero" onclick="addDigit('0')">0</button>
                <button class="numpad-btn delete" onclick="clearPin()">C</button>
            </div>

            <button class="btn-submit" id="loginBtn" onclick="login()" disabled>
                Enter
            </button>
        </div>

        <!-- Recipient Screen -->
        <div id="recipientScreen" class="screen recipient-screen">
            <div class="welcome-icon">🎁</div>
            <h1>Hello <span id="userName"></span>!</h1>
            <p class="message">You are the Secret Santa for:</p>
            <div class="recipient-name" id="recipientName"></div>
            <p class="message">Remember to keep it a secret! 🤫</p>
            <button class="btn-logout" onclick="logout()">← Back to Login</button>
        </div>
    </div>

    <script>
        // Credentials: { name: { pin, recipient } }
        const CREDENTIALS = {
            "Patrick": { pin: "1030", recipient: "Hilary" },
            "Hilary": { pin: "3566", recipient: "Don" },
            "Don": { pin: "3372", recipient: "Patrick" },
            "Amy": { pin: "9805", recipient: "Steven" },
            "Steven": { pin: "8600", recipient: "Amy" },
        };

        let currentPin = '';

        function normalizeName(name) {
            return name.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
        }

        function addDigit(digit) {
            if (currentPin.length < 4) {
                currentPin += digit;
                updatePinDisplay();
                updateLoginButton();
            }
        }

        function deleteDigit() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updatePinDisplay();
                updateLoginButton();
            }
        }

        function clearPin() {
            currentPin = '';
            updatePinDisplay();
            updateLoginButton();
        }

        function updatePinDisplay() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (i <= currentPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }

        function updateLoginButton() {
            const nameInput = document.getElementById('nameInput');
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = !(nameInput.value.trim() && currentPin.length === 4);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 3000);
        }

        function login() {
            const nameInput = document.getElementById('nameInput');
            const inputName = nameInput.value.trim();
            const normalizedInput = normalizeName(inputName);

            // Find matching user
            let matchedUser = null;
            for (const [name, data] of Object.entries(CREDENTIALS)) {
                if (normalizeName(name) === normalizedInput) {
                    matchedUser = { name, data };
                    break;
                }
            }

            if (!matchedUser) {
                showError(`"${inputName}" is not in our Secret Santa group.`);
                clearPin();
                return;
            }

            // Check PIN
            if (matchedUser.data.pin !== currentPin) {
                showError('Incorrect PIN. Please try again.');
                clearPin();
                return;
            }

            // Success! Show recipient
            showRecipient(matchedUser.name, matchedUser.data.recipient);
        }

        function showRecipient(userName, recipientName) {
            document.getElementById('userName').textContent = userName;
            document.getElementById('recipientName').textContent = recipientName;
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('recipientScreen').classList.add('active');
        }

        function logout() {
            document.getElementById('nameInput').value = '';
            currentPin = '';
            updatePinDisplay();
            updateLoginButton();
            document.getElementById('recipientScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
        }

        // Listen for name input changes
        document.getElementById('nameInput').addEventListener('input', updateLoginButton);

        // Allow Enter key to submit
        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentPin.length === 4) {
                login();
            }
        });
    </script>
</body>
</html>
