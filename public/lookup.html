<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎅 Nollaig Shona - Secret Santa</title>
    <link rel="stylesheet" href="lookup.css">
</head>
<body>
    <!-- CSS Snowflakes -->
    <div class="snowflake" aria-hidden="true">❄</div>
    <div class="snowflake" aria-hidden="true">❄</div>
    <div class="snowflake" aria-hidden="true">❅</div>
    <div class="snowflake" aria-hidden="true">❄</div>
    <div class="snowflake" aria-hidden="true">❅</div>
    <div class="snowflake" aria-hidden="true">❄</div>
    <div class="snowflake" aria-hidden="true">❅</div>
    <div class="snowflake" aria-hidden="true">❄</div>
    <div class="snowflake" aria-hidden="true">❅</div>
    <div class="snowflake" aria-hidden="true">❄</div>
    <div class="snowflake" aria-hidden="true">❅</div>
    <div class="snowflake" aria-hidden="true">❄</div>
    <div class="snowflake" aria-hidden="true">❅</div>
    <div class="snowflake" aria-hidden="true">❄</div>
    <div class="snowflake" aria-hidden="true">❅</div>
    <div class="snowflake" aria-hidden="true">❄</div>
    <div class="snowflake" aria-hidden="true">❅</div>
    <div class="snowflake" aria-hidden="true">❄</div>
    <div class="snowflake" aria-hidden="true">❅</div>
    <div class="snowflake" aria-hidden="true">❄</div>

    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">

            <h1>🎄 Nollaig Shona! ✨</h1>

            <div class="santa-image">
                <img src="assets/santa.png" alt="Santa">
            </div>

            <p class="subtitle">Laverty-Weir Secret Santa 2025!</p>

            <div class="error-message" id="errorMessage"></div>

            <div class="input-group">
                <label for="nameInput">🎅 Your Name</label>
                <input
                    type="text"
                    id="nameInput"
                    placeholder="Enter your name..."
                    autocomplete="off"
                    autofocus
                >
            </div>

            <div class="input-group">
                <label>🔢 Your 4-Digit PIN</label>
                <div class="pin-display">
                    <div class="pin-dots">
                        <div class="pin-dot" id="dot1"></div>
                        <div class="pin-dot" id="dot2"></div>
                        <div class="pin-dot" id="dot3"></div>
                        <div class="pin-dot" id="dot4"></div>
                    </div>
                </div>
            </div>

            <div class="numpad">
                <button class="numpad-btn" onclick="addDigit('1')">1</button>
                <button class="numpad-btn" onclick="addDigit('2')">2</button>
                <button class="numpad-btn" onclick="addDigit('3')">3</button>
                <button class="numpad-btn" onclick="addDigit('4')">4</button>
                <button class="numpad-btn" onclick="addDigit('5')">5</button>
                <button class="numpad-btn" onclick="addDigit('6')">6</button>
                <button class="numpad-btn" onclick="addDigit('7')">7</button>
                <button class="numpad-btn" onclick="addDigit('8')">8</button>
                <button class="numpad-btn" onclick="addDigit('9')">9</button>
                <button class="numpad-btn delete" onclick="deleteDigit()">←</button>
                <button class="numpad-btn zero" onclick="addDigit('0')">0</button>
                <button class="numpad-btn delete" onclick="clearPin()">C</button>
            </div>

            <button class="btn-submit" id="loginBtn" onclick="login()" disabled>
                🎁 Enter
            </button>
        </div>

        <!-- Recipient Screen -->
        <div id="recipientScreen" class="screen recipient-screen">
            <h1>Hello <span id="userName"></span>! 🎄</h1>
            <p class="message">You are the Secret Santa for:</p>

            <div class="elf-exchange">
                <div class="elf-image gifter" id="gifterElfImage"></div>
                <div class="present-animation">
                    <div class="present">🎁</div>
                </div>
                <div class="elf-image recipient" id="recipientElfImage"></div>
            </div>

            <div class="recipient-name" id="recipientName"></div>
            <p class="message">Remember to keep it a secret! 🤫🎅</p>
            <button class="btn-logout" onclick="logout()">🎄 Back to Login</button>
        </div>
    </div>

    <script>
        // Credentials: { name: { pin, recipient } }
        const CREDENTIALS = {
            "Patrick": { pin: "9660", recipient: "Don" },
            "Hilary": { pin: "9271", recipient: "Amy" },
            "Don": { pin: "6542", recipient: "Stephen" },
            "Amy": { pin: "8683", recipient: "Patrick" },
            "Stephen": { pin: "9016", recipient: "Hilary" },
        };

        // Elf images for each person
        const ELF_IMAGES = {
            "Patrick": "assets/patrick_elf.png",
            "Hilary": "assets/hilary_elf.png",
            "Don": "assets/don_elf.png",
            "Amy": "assets/amy_elf.png",
            "Stephen": "assets/stephen_elf.png"
        };

        let currentPin = '';

        function normalizeName(name) {
            return name.toLowerCase().replace(/[^a-z0-9\s]/g, '').trim();
        }

        function addDigit(digit) {
            if (currentPin.length < 4) {
                currentPin += digit;
                updatePinDisplay();
                updateLoginButton();
            }
        }

        function deleteDigit() {
            if (currentPin.length > 0) {
                currentPin = currentPin.slice(0, -1);
                updatePinDisplay();
                updateLoginButton();
            }
        }

        function clearPin() {
            currentPin = '';
            updatePinDisplay();
            updateLoginButton();
        }

        function updatePinDisplay() {
            for (let i = 1; i <= 4; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (i <= currentPin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            }
        }

        function updateLoginButton() {
            const nameInput = document.getElementById('nameInput');
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = !(nameInput.value.trim() && currentPin.length === 4);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 3000);
        }

        function login() {
            const nameInput = document.getElementById('nameInput');
            const inputName = nameInput.value.trim();
            const normalizedInput = normalizeName(inputName);

            // Find matching user
            let matchedUser = null;
            for (const [name, data] of Object.entries(CREDENTIALS)) {
                if (normalizeName(name) === normalizedInput) {
                    matchedUser = { name, data };
                    break;
                }
            }

            if (!matchedUser) {
                showError(`"${inputName}" is not in our Secret Santa group.`);
                clearPin();
                return;
            }

            // Check PIN
            if (matchedUser.data.pin !== currentPin) {
                showError('Incorrect PIN. Please try again.');
                clearPin();
                return;
            }

            // Success! Show recipient
            showRecipient(matchedUser.name, matchedUser.data.recipient);
        }

        function showRecipient(userName, recipientName) {
            document.getElementById('userName').textContent = userName;
            document.getElementById('recipientName').textContent = recipientName;

            // Show elf images for both GIFTER and RECIPIENT
            const gifterElfImage = ELF_IMAGES[userName];
            const recipientElfImage = ELF_IMAGES[recipientName];

            const gifterDiv = document.getElementById('gifterElfImage');
            const recipientDiv = document.getElementById('recipientElfImage');

            gifterDiv.innerHTML = `<img src="${gifterElfImage}" alt="${userName} Elf">`;
            recipientDiv.innerHTML = `<img src="${recipientElfImage}" alt="${recipientName} Elf">`;

            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('recipientScreen').classList.add('active');
        }

        function logout() {
            document.getElementById('nameInput').value = '';
            currentPin = '';
            updatePinDisplay();
            updateLoginButton();
            document.getElementById('recipientScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
        }

        // Listen for name input changes
        document.getElementById('nameInput').addEventListener('input', updateLoginButton);

        // Allow Enter key to submit
        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && currentPin.length === 4) {
                login();
            }
        });
    </script>
</body>
</html>
